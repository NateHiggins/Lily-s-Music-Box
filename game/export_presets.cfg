[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; World Packages are not Godot resources - no importer, no .import file - so
; "all_resources" walks straight past them and the arcade ships with twelve
; cabinets and no skins. Verified by mounting an exported pack from an empty
; project: without this line res://assets/arcade/packages does not exist.
include_filter="*.swcpkg"
exclude_filter="tests/*,docs/*,assets/building/textures/sky/*_source.png,assets/building/textures/sky/*_preview.jpg,assets/building/textures/sky/orison_close_city_realism_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_distant_city_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_sky_only_4k.png"
export_path="../build/android/orison.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

