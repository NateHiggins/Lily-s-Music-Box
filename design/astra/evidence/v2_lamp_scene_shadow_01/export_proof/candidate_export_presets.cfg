[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Keep the desktop artifact content-identical to Android: non-resource arcade
; packages must be named explicitly, while tests, source plates and superseded
; sky studies remain development evidence rather than shipped payload.
include_filter="*.swcpkg,*.compute"
exclude_filter="tests/*,docs/*,assets/audio/freesound/source/*,assets/audio/soundbits/*,assets/building/textures/sky/*_source.png,assets/building/textures/sky/*_preview.jpg,assets/building/textures/sky/orison_close_city_realism_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_distant_city_4k.png,assets/building/textures/sky/orison_hyperreal_night_panorama_sky_only_4k.png"
export_path="../build/windows/PleaseRemainOnTheLine.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0"
application/product_version="0.1.0"
application/company_name=""
application/product_name="Please Remain on the Line"
application/file_description="Please Remain on the Line"
application/copyright=""
application/trademarks=""
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash\nexport DISPLAY=:0\nunzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"\n\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash\nkill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")\nrm -rf \"{temp_dir}\""
